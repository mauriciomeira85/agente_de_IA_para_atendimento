# ==============================================================================
# ARQUIVO: alembic.ini
# ------------------------------------------------------------------------------
# Configuração da ferramenta Alembic, responsável por versionar as
# mudanças no esquema do banco de dados (criação/alteração de tabelas) de
# forma controlada, em vez de editar o banco na mão. A URL de conexão real
# é lida do arquivo .env pelo alembic/env.py — não precisa ser editada
# aqui.
# ==============================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
